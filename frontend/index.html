<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NIM FAQ Assistant</title>
  <style>
    /* ── Reset & base ─────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3250;
      --accent: #76b900;   /* NVIDIA green */
      --accent2: #57a6ff;
      --text: #e8eaf0;
      --text-muted: #7b82a0;
      --user-bubble: #1e3a5f;
      --bot-bubble: #1e2638;
      --radius: 12px;
      --font: 'Segoe UI', system-ui, sans-serif;
    }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ───────────────────────────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .logo { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
    .logo span { color: var(--accent); }
    .badge {
      font-size: 11px;
      background: var(--accent);
      color: #000;
      padding: 2px 8px;
      border-radius: 99px;
      font-weight: 700;
    }

    /* ── Layout ───────────────────────────────────────────────────────────── */
    .app {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Sidebar ──────────────────────────────────────────────────────────── */
    .sidebar {
      width: 240px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 20px 12px;
      flex-shrink: 0;
    }
    .sidebar h3 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      padding: 0 8px;
      margin-bottom: 4px;
    }
    .tab-btn {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 14px;
      text-align: left;
      transition: background 0.15s, color 0.15s;
      width: 100%;
    }
    .tab-btn:hover { background: var(--surface2); color: var(--text); }
    .tab-btn.active { background: var(--surface2); color: var(--accent); font-weight: 600; }
    .tab-btn .icon { font-size: 18px; }

    .divider { height: 1px; background: var(--border); margin: 8px 0; }

    /* Config section */
    .config-section { padding: 0 8px; }
    .config-section label {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .config-section select, .config-section input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 13px;
      margin-bottom: 12px;
    }
    .config-section select:focus, .config-section input:focus {
      outline: none;
      border-color: var(--accent);
    }

    /* ── Chat area ────────────────────────────────────────────────────────── */
    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .mode-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      color: var(--text-muted);
    }
    .mode-badge {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: 3px 10px;
      font-size: 12px;
      color: var(--accent2);
    }
    .clear-btn {
      margin-left: auto;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 6px;
      padding: 4px 12px;
      font-size: 12px;
      cursor: pointer;
    }
    .clear-btn:hover { border-color: var(--accent); color: var(--accent); }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .messages::-webkit-scrollbar { width: 6px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .message {
      display: flex;
      gap: 10px;
      max-width: 820px;
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    .message.user { flex-direction: row-reverse; margin-left: auto; }
    .avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }
    .message.user .avatar { background: var(--user-bubble); }
    .message.bot .avatar { background: var(--accent); color: #000; font-weight: 700; font-size: 13px; }

    .bubble {
      padding: 12px 16px;
      border-radius: var(--radius);
      font-size: 14px;
      line-height: 1.6;
      max-width: 680px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .message.user .bubble {
      background: var(--user-bubble);
      border-bottom-right-radius: 4px;
    }
    .message.bot .bubble {
      background: var(--bot-bubble);
      border-bottom-left-radius: 4px;
      border: 1px solid var(--border);
    }

    .faq-matches {
      margin-top: 10px;
      padding: 8px 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 12px;
      color: var(--text-muted);
    }
    .faq-matches strong { color: var(--accent2); }

    .typing {
      display: flex; gap: 4px; align-items: center; padding: 8px 0;
    }
    .dot {
      width: 7px; height: 7px;
      background: var(--text-muted);
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }

    /* ── Input bar ────────────────────────────────────────────────────────── */
    .input-bar {
      padding: 16px 20px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      flex-shrink: 0;
    }
    .input-bar textarea {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      resize: none;
      font-family: var(--font);
      line-height: 1.5;
      max-height: 140px;
    }
    .input-bar textarea:focus { outline: none; border-color: var(--accent); }
    .send-btn {
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 10px;
      padding: 0 20px;
      font-size: 18px;
      cursor: pointer;
      font-weight: 700;
      transition: opacity 0.15s;
    }
    .send-btn:hover { opacity: 0.85; }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── Empty state ──────────────────────────────────────────────────────── */
    .empty-state {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      flex: 1; gap: 12px; color: var(--text-muted); text-align: center; padding: 40px;
    }
    .empty-state .big-icon { font-size: 48px; }
    .empty-state h2 { font-size: 18px; color: var(--text); }
    .empty-state p { font-size: 14px; max-width: 360px; line-height: 1.6; }
    .suggestions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 8px; }
    .suggestion-chip {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: 6px 14px;
      font-size: 13px;
      color: var(--text-muted);
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    .suggestion-chip:hover { border-color: var(--accent); color: var(--text); }

    /* ── Error toast ──────────────────────────────────────────────────────── */
    .toast {
      position: fixed; bottom: 80px; right: 24px;
      background: #c0392b;
      color: white;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13px;
      opacity: 0; transform: translateY(10px);
      transition: all 0.3s;
      pointer-events: none;
      z-index: 999;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>

<header>
  <div class="logo">NIM <span>FAQ</span> Assistant</div>
  <div class="badge">NVIDIA NIM</div>
</header>

<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar">
    <h3>Mode</h3>
    <button class="tab-btn active" data-tab="faq" onclick="switchTab('faq')">
      <span class="icon">📚</span> FAQ Bot
    </button>
    <button class="tab-btn" data-tab="chat" onclick="switchTab('chat')">
      <span class="icon">💬</span> General Chat
    </button>
    <button class="tab-btn" data-tab="hybrid" onclick="switchTab('hybrid')">
      <span class="icon">🔀</span> FAQ + Chat
    </button>

    <div class="divider"></div>
    <h3>Config</h3>
    <div class="config-section">
      <label>Backend URL</label>
      <input type="text" id="backendUrl" value="http://localhost:8000" />
      <label>FAQ Mode</label>
      <select id="faqMode">
        <option value="hybrid">Hybrid (NIM + FAQ)</option>
        <option value="faq-only">FAQ Only (no LLM)</option>
      </select>
    </div>
  </aside>

  <!-- Chat -->
  <div class="chat-container">
    <div class="mode-bar">
      Active mode: <span class="mode-badge" id="modeBadge">📚 FAQ Bot</span>
      <button class="clear-btn" onclick="clearChat()">Clear chat</button>
    </div>

    <div id="messages" class="messages"></div>

    <div class="input-bar">
      <textarea
        id="inputBox"
        rows="1"
        placeholder="Ask me anything..."
        onkeydown="handleKey(event)"
        oninput="autoResize(this)"
      ></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // ── State ──────────────────────────────────────────────────────────────────
  let currentTab = 'faq';
  let sessionId = null;
  let isLoading = false;

  const SUGGESTIONS = {
    faq: [
      "What plans are available?",
      "How do I reset my password?",
      "What are your API rate limits?",
      "Do you have a Zapier integration?",
    ],
    chat: [
      "Explain REST APIs in simple terms",
      "Write a Python hello world",
      "What is NVIDIA NIM?",
    ],
    hybrid: [
      "How do I get an API key?",
      "Tell me about your pricing",
      "What happens if I hit the rate limit?",
    ],
  };

  const MODE_LABELS = {
    faq: '📚 FAQ Bot',
    chat: '💬 General Chat',
    hybrid: '🔀 FAQ + Chat',
  };

  // ── Tab switching ──────────────────────────────────────────────────────────
  function switchTab(tab) {
    currentTab = tab;
    sessionId = null; // new session per mode switch
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
    document.getElementById('modeBadge').textContent = MODE_LABELS[tab];
    clearMessages();
    showEmptyState();
  }

  // ── Messages ───────────────────────────────────────────────────────────────
  function clearMessages() {
    document.getElementById('messages').innerHTML = '';
  }

  function clearChat() {
    sessionId = null;
    clearMessages();
    showEmptyState();
  }

  function showEmptyState() {
    const chips = (SUGGESTIONS[currentTab] || [])
      .map(s => `<div class="suggestion-chip" onclick="prefill('${s.replace(/'/g,"\\'")})">${s}</div>`)
      .join('');
    document.getElementById('messages').innerHTML = `
      <div class="empty-state">
        <div class="big-icon">${currentTab === 'faq' ? '📚' : currentTab === 'chat' ? '💬' : '🔀'}</div>
        <h2>${MODE_LABELS[currentTab]}</h2>
        <p>${currentTab === 'faq'
          ? 'Ask questions and get answers from the FAQ knowledge base, augmented by NIM.'
          : currentTab === 'chat'
          ? 'Have a free-form multi-turn conversation powered by NVIDIA NIM.'
          : 'Hybrid mode: NIM answers are informed by the FAQ knowledge base.'
        }</p>
        <div class="suggestions">${chips}</div>
      </div>
    `;
  }

  function prefill(text) {
    const box = document.getElementById('inputBox');
    box.value = text;
    autoResize(box);
    box.focus();
  }

  function appendMessage(role, content, matchedFaqs) {
    const container = document.getElementById('messages');
    // Remove empty state if present
    const empty = container.querySelector('.empty-state');
    if (empty) empty.remove();

    const div = document.createElement('div');
    div.className = `message ${role}`;

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = role === 'user' ? '🧑' : 'N';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = content;

    if (matchedFaqs && matchedFaqs.length > 0) {
      const faqDiv = document.createElement('div');
      faqDiv.className = 'faq-matches';
      faqDiv.innerHTML = `<strong>Matched FAQs:</strong> ` +
        matchedFaqs.map(f => `<em>${f.question}</em> [${f.category}]`).join(' · ');
      bubble.appendChild(faqDiv);
    }

    div.appendChild(avatar);
    div.appendChild(bubble);
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
  }

  function showTyping() {
    const container = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'message bot';
    div.id = 'typing-indicator';
    div.innerHTML = `
      <div class="avatar">N</div>
      <div class="bubble">
        <div class="typing">
          <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>
      </div>`;
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
  }

  function removeTyping() {
    document.getElementById('typing-indicator')?.remove();
  }

  // ── Send ───────────────────────────────────────────────────────────────────
  async function sendMessage() {
    const input = document.getElementById('inputBox');
    const text = input.value.trim();
    if (!text || isLoading) return;

    isLoading = true;
    document.getElementById('sendBtn').disabled = true;
    input.value = '';
    autoResize(input);

    appendMessage('user', text);
    showTyping();

    const base = document.getElementById('backendUrl').value.replace(/\/$/, '');

    try {
      let data;

      if (currentTab === 'faq') {
        // ── FAQ Bot ─────────────────────────────────────────────────────────
        const res = await fetch(`${base}/api/faq-ask`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            question: text,
            mode: document.getElementById('faqMode').value,
          }),
        });
        if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);
        data = await res.json();
        removeTyping();
        appendMessage('bot', data.answer, data.matched_faqs);

      } else {
        // ── Chat / Hybrid ────────────────────────────────────────────────────
        const res = await fetch(`${base}/api/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            message: text,
            session_id: sessionId,
            mode: currentTab === 'hybrid' ? 'faq-aware' : 'assistant',
          }),
        });
        if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);
        data = await res.json();
        sessionId = data.session_id;
        removeTyping();
        appendMessage('bot', data.reply);
      }

    } catch (err) {
      removeTyping();
      showToast(`Error: ${err.message}`);
      appendMessage('bot', `⚠️ Something went wrong: ${err.message}`);
    } finally {
      isLoading = false;
      document.getElementById('sendBtn').disabled = false;
    }
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 140) + 'px';
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 4000);
  }

  // ── Init ───────────────────────────────────────────────────────────────────
  showEmptyState();
</script>
</body>
</html>
