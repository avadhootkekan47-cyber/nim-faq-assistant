<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>EstateAI — Your Intelligent Property Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
--gold:#C9A84C;--gold-light:#E8C97A;--gold-pale:#F5EDD6;
--dark:#0A0C12;--dark2:#111420;--dark3:#181C2E;--dark4:#1F2438;
--surface:#242840;--surface2:#2C3050;
--text:#F0EDE6;--text2:#B8B4AA;--text3:#7A7870;
--border:rgba(201,168,76,0.15);--border2:rgba(201,168,76,0.3);
--radius:16px;--radius-sm:10px;
--sans:'DM Sans',sans-serif;--serif:'Playfair Display',serif;
}
html,body{height:100%;font-family:var(--sans);background:var(--dark);color:var(--text);overflow:hidden}
.bg{position:fixed;inset:0;z-index:0;background:
  radial-gradient(ellipse 80% 60% at 20% 10%,rgba(201,168,76,0.06) 0%,transparent 60%),
  radial-gradient(ellipse 60% 80% at 80% 90%,rgba(42,55,120,0.15) 0%,transparent 60%),
  linear-gradient(135deg,#0A0C12 0%,#0E1020 40%,#0A0C18 100%)}
.bg-grid{position:fixed;inset:0;z-index:0;
  background-image:linear-gradient(rgba(201,168,76,0.03) 1px,transparent 1px),
  linear-gradient(90deg,rgba(201,168,76,0.03) 1px,transparent 1px);
  background-size:60px 60px}
.page{position:relative;z-index:1;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;justify-content:space-between;padding:18px 32px;background:rgba(10,12,18,0.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);flex-shrink:0}
.brand{display:flex;align-items:center;gap:14px}
.brand-logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,#C9A84C,#8B6A1E);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:18px;font-weight:700;color:#0A0C12}
.brand-name{font-family:var(--serif);font-size:22px;font-weight:600;letter-spacing:-0.3px}
.brand-name span{color:var(--gold)}
.brand-tagline{font-size:11px;color:var(--text3);letter-spacing:0.8px;text-transform:uppercase;margin-top:1px}
.header-right{display:flex;align-items:center;gap:12px}
.status-pill{display:flex;align-items:center;gap:7px;background:rgba(201,168,76,0.08);border:1px solid var(--border2);border-radius:99px;padding:6px 14px;font-size:12px;color:var(--gold-light);letter-spacing:0.3px}
.status-dot{width:7px;height:7px;border-radius:50%;background:#4CAF50;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.6;transform:scale(0.85)}}
.mode-bar{display:flex;align-items:center;gap:0;padding:12px 32px;background:rgba(10,12,18,0.6);border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto}
.mode-tab{display:flex;align-items:center;gap:8px;padding:8px 20px;border-radius:99px;border:1px solid transparent;background:transparent;color:var(--text3);cursor:pointer;font-size:13px;font-family:var(--sans);font-weight:500;transition:all 0.2s;white-space:nowrap}
.mode-tab:hover{color:var(--text2);background:rgba(255,255,255,0.04)}
.mode-tab.active{background:rgba(201,168,76,0.12);border-color:var(--border2);color:var(--gold-light)}
.mode-tab svg{width:14px;height:14px;flex-shrink:0}
.mode-sep{width:1px;height:20px;background:var(--border);margin:0 6px;flex-shrink:0}
.main{flex:1;display:flex;overflow:hidden}
.sidebar{width:280px;flex-shrink:0;background:rgba(10,12,18,0.5);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto}
.sidebar::-webkit-scrollbar{width:4px}
.sidebar::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
.sidebar-section{padding:20px 16px 0}
.sidebar-label{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text3);margin-bottom:12px;font-weight:600}
.quick-action{display:flex;align-items:flex-start;gap:12px;padding:11px 12px;border-radius:10px;background:rgba(255,255,255,0.02);border:1px solid var(--border);cursor:pointer;margin-bottom:7px;transition:all 0.2s;text-align:left;width:100%}
.quick-action:hover{background:rgba(201,168,76,0.06);border-color:var(--border2);transform:translateX(2px)}
.qa-icon{width:30px;height:30px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px}
.qa-icon.gold{background:rgba(201,168,76,0.15)}
.qa-icon.blue{background:rgba(59,130,246,0.12)}
.qa-icon.green{background:rgba(74,196,139,0.12)}
.qa-icon.purple{background:rgba(139,92,246,0.12)}
.qa-icon.red{background:rgba(239,68,68,0.12)}
.qa-title{font-size:12px;font-weight:600;color:var(--text);margin-bottom:2px}
.qa-desc{font-size:11px;color:var(--text3);line-height:1.4}
.config-box{margin:16px;padding:14px;background:rgba(201,168,76,0.04);border:1px solid var(--border);border-radius:12px}
.config-row{margin-bottom:10px}
.config-row:last-child{margin-bottom:0}
.config-label{font-size:10px;color:var(--text3);margin-bottom:4px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px}
.config-input{width:100%;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:7px;color:var(--text);padding:7px 10px;font-size:12px;font-family:var(--sans);outline:none;transition:border 0.2s}
.config-input:focus{border-color:var(--border2)}
.chat-area{flex:1;display:flex;flex-direction:column;overflow:hidden}
.messages{flex:1;overflow-y:auto;padding:32px;display:flex;flex-direction:column;gap:24px}
.messages::-webkit-scrollbar{width:5px}
.messages::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;text-align:center;min-height:400px}
.estate-emblem{width:80px;height:80px;border-radius:22px;margin:0 auto 24px;background:linear-gradient(135deg,rgba(201,168,76,0.2),rgba(201,168,76,0.04));border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:36px}
.empty-headline{font-family:var(--serif);font-size:28px;font-weight:600;margin-bottom:10px;letter-spacing:-0.5px;line-height:1.25;color:var(--text)}
.empty-headline span{color:var(--gold)}
.empty-sub{font-size:14px;color:var(--text3);line-height:1.6;max-width:400px;margin:0 auto 32px}
.suggestions-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:580px;width:100%}
.suggestion-card{padding:14px 16px;border-radius:12px;text-align:left;background:rgba(255,255,255,0.02);border:1px solid var(--border);cursor:pointer;transition:all 0.2s}
.suggestion-card:hover{background:rgba(201,168,76,0.07);border-color:var(--border2);transform:translateY(-2px)}
.sc-label{font-size:10px;color:var(--gold);font-weight:700;text-transform:uppercase;letter-spacing:0.8px;margin-bottom:5px}
.sc-text{font-size:13px;color:var(--text2);line-height:1.4}
.msg{display:flex;gap:12px;animation:fadeUp 0.25s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg.user{flex-direction:row-reverse}
.avatar{width:34px;height:34px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px}
.avatar.bot{background:linear-gradient(135deg,#C9A84C,#8B6A1E);color:#0A0C12;font-family:var(--serif);font-weight:700;font-size:12px;letter-spacing:-0.5px}
.avatar.user{background:var(--surface2)}
.bubble{max-width:700px;padding:14px 18px;border-radius:16px;font-size:14px;line-height:1.75;white-space:pre-wrap;word-break:break-word}
.msg.user .bubble{background:rgba(201,168,76,0.1);border:1px solid rgba(201,168,76,0.18);border-bottom-right-radius:4px;color:var(--text)}
.msg.bot .bubble{background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:4px;color:var(--text)}
.faq-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;padding-top:10px;border-top:1px solid var(--border)}
.faq-tag{font-size:11px;padding:3px 10px;border-radius:99px;background:rgba(201,168,76,0.08);border:1px solid var(--border2);color:var(--gold-light)}
.typing-wrap{display:flex;gap:12px;animation:fadeUp 0.2s ease}
.typing-bubble{background:var(--surface);border:1px solid var(--border);border-radius:16px;border-bottom-left-radius:4px;padding:16px 20px;display:flex;gap:5px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--gold);opacity:0.4;animation:blink 1.2s infinite}
.dot:nth-child(2){animation-delay:0.2s}
.dot:nth-child(3){animation-delay:0.4s}
@keyframes blink{0%,60%,100%{opacity:0.4;transform:scale(1)}30%{opacity:1;transform:scale(1.2)}}
.error-bubble{background:rgba(220,60,50,0.08);border:1px solid rgba(220,60,50,0.2);border-radius:16px;border-bottom-left-radius:4px;padding:14px 18px;font-size:13px;color:#FF8080;max-width:680px}
.input-wrap{padding:18px 32px 22px;background:rgba(10,12,18,0.85);backdrop-filter:blur(20px);border-top:1px solid var(--border);flex-shrink:0}
.input-row{display:flex;gap:10px;align-items:flex-end;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:10px 10px 10px 18px;transition:border-color 0.2s}
.input-row:focus-within{border-color:var(--border2)}
.input-row textarea{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:14px;font-family:var(--sans);resize:none;line-height:1.6;max-height:160px;padding:4px 0}
.input-row textarea::placeholder{color:var(--text3)}
.send-btn{width:42px;height:42px;border-radius:12px;flex-shrink:0;background:linear-gradient(135deg,#C9A84C,#8B6A1E);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s}
.send-btn:hover{opacity:0.88;transform:scale(1.04)}
.send-btn:disabled{opacity:0.3;cursor:not-allowed;transform:none}
.send-btn svg{width:17px;height:17px}
.input-hint{display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding:0 4px}
.hint-left{font-size:11px;color:var(--text3)}
.clear-btn{font-size:11px;color:var(--text3);background:none;border:none;cursor:pointer;padding:2px 8px;border-radius:6px;transition:color 0.2s;font-family:var(--sans)}
.clear-btn:hover{color:var(--gold)}
@media(max-width:768px){
  .sidebar{display:none}
  header{padding:14px 16px}
  .messages{padding:16px}
  .input-wrap{padding:12px 16px 18px}
  .suggestions-grid{grid-template-columns:1fr}
  .empty-headline{font-size:22px}
  .mode-bar{padding:10px 12px}
}
</style>
</head>
<body>
<div class="bg"></div>
<div class="bg-grid"></div>
<div class="page">

<header>
  <div class="brand">
    <div class="brand-logo">E</div>
    <div>
      <div class="brand-name">Estate<span>AI</span></div>
      <div class="brand-tagline">Intelligent Property Assistant</div>
    </div>
  </div>
  <div class="header-right">
    <div class="status-pill">
      <div class="status-dot"></div>
      NVIDIA NIM · Live
    </div>
  </div>
</header>

<div class="mode-bar">
  <button class="mode-tab active" onclick="switchMode('faq')" id="tab-faq">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    FAQ Assistant
  </button>
  <div class="mode-sep"></div>
  <button class="mode-tab" onclick="switchMode('chat')" id="tab-chat">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    General Chat
  </button>
  <div class="mode-sep"></div>
  <button class="mode-tab" onclick="switchMode('hybrid')" id="tab-hybrid">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
    AI + FAQ Hybrid
  </button>
</div>

<div class="main">
  <aside class="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-label">Quick Actions</div>
      <button class="quick-action" onclick="prefill('What is the complete step-by-step process for buying a home in India?')">
        <div class="qa-icon gold">🏠</div>
        <div><div class="qa-title">Buying Guide</div><div class="qa-desc">Complete home buying process</div></div>
      </button>
      <button class="quick-action" onclick="prefill('How do I calculate home loan EMI and what loan amount am I eligible for?')">
        <div class="qa-icon blue">💰</div>
        <div><div class="qa-title">Loan & EMI</div><div class="qa-desc">Eligibility, rates & calculator</div></div>
      </button>
      <button class="quick-action" onclick="prefill('What documents do I need to sell my property and what is the process?')">
        <div class="qa-icon green">📋</div>
        <div><div class="qa-title">Sell Property</div><div class="qa-desc">Documents & selling guide</div></div>
      </button>
      <button class="quick-action" onclick="prefill('What should a rental agreement include? What are my rights as a tenant?')">
        <div class="qa-icon purple">🔑</div>
        <div><div class="qa-title">Renting Guide</div><div class="qa-desc">Agreements, deposits & rights</div></div>
      </button>
      <button class="quick-action" onclick="prefill('What is RERA, stamp duty, and how do they protect property buyers?')">
        <div class="qa-icon red">⚖️</div>
        <div><div class="qa-title">Legal & RERA</div><div class="qa-desc">Stamp duty, RERA, POA</div></div>
      </button>
      <button class="quick-action" onclick="prefill('Can NRIs buy property in India? What are the rules and restrictions?')">
        <div class="qa-icon gold">🌍</div>
        <div><div class="qa-title">NRI Buying</div><div class="qa-desc">Rules for overseas Indians</div></div>
      </button>
    </div>
    <div class="config-box">
      <div class="sidebar-label" style="margin-bottom:12px">Settings</div>
      <div class="config-row">
        <div class="config-label">Backend URL</div>
        <input class="config-input" type="text" id="backendUrl" value="http://localhost:8000"/>
      </div>
      <div class="config-row">
        <div class="config-label">FAQ Mode</div>
        <select class="config-input" id="faqMode">
          <option value="hybrid">Hybrid (AI + FAQ)</option>
          <option value="faq-only">FAQ Only</option>
        </select>
      </div>
    </div>
  </aside>

  <div class="chat-area">
    <div class="messages" id="messages"></div>
    <div class="input-wrap">
      <div class="input-row">
        <textarea id="inputBox" rows="1" placeholder="Ask about buying, selling, renting, loans, or legal matters…" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()" aria-label="Send">
          <svg viewBox="0 0 24 24" fill="none" stroke="#0A0C12" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
      <div class="input-hint">
        <span class="hint-left">Enter to send · Shift+Enter for new line</span>
        <button class="clear-btn" onclick="clearChat()">Clear conversation</button>
      </div>
    </div>
  </div>
</div>
</div>

<script>
let mode='faq',sessionId=null,busy=false;
const SUGG={
  faq:[
    {label:'Buying',text:'What is the complete process for buying a home in India?'},
    {label:'Home Loans',text:'How much home loan am I eligible for?'},
    {label:'Selling',text:'How do I find the right price to sell my property?'},
    {label:'Renting',text:'What should a rental agreement include to protect me?'},
    {label:'Legal',text:'What is RERA and why is it important for buyers?'},
    {label:'Capital Gains',text:'What tax will I pay on selling my property?'},
  ],
  chat:[
    {label:'Budget Advice',text:'I have ₹50 lakhs budget in Pune. What should I look for?'},
    {label:'Compare',text:'Should I buy ready-to-move or under-construction property?'},
    {label:'NRI',text:'Can NRIs buy property in India? What are the rules?'},
    {label:'Vastu',text:'Which direction is best for a home as per Vastu Shastra?'},
  ],
  hybrid:[
    {label:'Investment',text:'Is real estate a good investment in India right now?'},
    {label:'First Home',text:'I am a first-time buyer — walk me through everything.'},
    {label:'Agent Tips',text:'How do I find a trustworthy real estate agent?'},
    {label:'Negotiate',text:'How do I negotiate the best price when buying a property?'},
  ],
};
const PH={faq:'Ask about buying, selling, loans, legal matters…',chat:'Ask me anything about real estate…',hybrid:'Get AI answers enriched with our FAQ knowledge base…'};

function switchMode(m){
  mode=m;sessionId=null;
  document.querySelectorAll('.mode-tab').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+m).classList.add('active');
  document.getElementById('inputBox').placeholder=PH[m];
  clearMessages();showEmpty();
}
function showEmpty(){
  const msgs=document.getElementById('messages');
  const chips=(SUGG[mode]||[]).map(s=>`<div class="suggestion-card" onclick="prefill('${s.text.replace(/'/g,"\\'")}')"><div class="sc-label">${s.label}</div><div class="sc-text">${s.text}</div></div>`).join('');
  msgs.innerHTML=`<div class="empty-state"><div class="estate-emblem">🏡</div><div class="empty-headline">Your <span>Property Expert</span><br>is Ready</div><p class="empty-sub">Ask anything about Indian real estate — buying, selling, renting, home loans, RERA, stamp duty, and more. Powered by NVIDIA NIM AI.</p><div class="suggestions-grid">${chips}</div></div>`;
}
function prefill(t){const b=document.getElementById('inputBox');b.value=t;autoResize(b);b.focus()}
function clearMessages(){document.getElementById('messages').innerHTML=''}
function clearChat(){sessionId=null;clearMessages();showEmpty()}
function removeEmpty(){document.querySelector('.empty-state')?.remove()}
function appendMsg(role,content,faqMatches){
  removeEmpty();
  const msgs=document.getElementById('messages');
  const div=document.createElement('div');div.className=`msg ${role}`;
  const av=document.createElement('div');av.className=`avatar ${role}`;av.textContent=role==='user'?'👤':'EA';
  const bub=document.createElement('div');bub.className='bubble';bub.textContent=content;
  if(faqMatches&&faqMatches.length){
    const tags=document.createElement('div');tags.className='faq-tags';
    faqMatches.forEach(f=>{const t=document.createElement('span');t.className='faq-tag';t.textContent=f.category+' · '+f.question.slice(0,42)+'…';tags.appendChild(t)});
    bub.appendChild(tags);
  }
  div.appendChild(av);div.appendChild(bub);msgs.appendChild(div);msgs.scrollTop=msgs.scrollHeight;
}
function appendError(msg){
  removeEmpty();
  const msgs=document.getElementById('messages');
  const div=document.createElement('div');div.className='msg bot';
  div.innerHTML=`<div class="avatar bot">EA</div><div class="error-bubble">⚠️ ${msg}</div>`;
  msgs.appendChild(div);msgs.scrollTop=msgs.scrollHeight;
}
function showTyping(){
  const msgs=document.getElementById('messages');
  const div=document.createElement('div');div.className='typing-wrap';div.id='typing';
  div.innerHTML=`<div class="avatar bot">EA</div><div class="typing-bubble"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
  msgs.appendChild(div);msgs.scrollTop=msgs.scrollHeight;
}
function hideTyping(){document.getElementById('typing')?.remove()}
async function sendMessage(){
  const box=document.getElementById('inputBox');
  const text=box.value.trim();
  if(!text||busy)return;
  busy=true;document.getElementById('sendBtn').disabled=true;
  box.value='';autoResize(box);appendMsg('user',text);showTyping();
  const base=document.getElementById('backendUrl').value.replace(/\/$/,'');
  try{
    if(mode==='faq'){
      const res=await fetch(`${base}/api/faq-ask`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:text,mode:document.getElementById('faqMode').value})});
      if(!res.ok)throw new Error(`${res.status} — ${await res.text()}`);
      const d=await res.json();hideTyping();appendMsg('bot',d.answer,d.matched_faqs);
    }else{
      const res=await fetch(`${base}/api/chat`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,session_id:sessionId,mode:mode==='hybrid'?'faq-aware':'assistant'})});
      if(!res.ok)throw new Error(`${res.status} — ${await res.text()}`);
      const d=await res.json();sessionId=d.session_id;hideTyping();appendMsg('bot',d.reply);
    }
  }catch(e){hideTyping();appendError(e.message);}
  finally{busy=false;document.getElementById('sendBtn').disabled=false;box.focus()}
}
function handleKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}}
function autoResize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,160)+'px'}
showEmpty();
</script>
</body>
</html>
