version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: ../infra/Dockerfile.backend
    container_name: nim-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - APP_ENV=production
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    volumes:
      # Mount FAQ data so you can edit without rebuilding
      - ./backend/faq_data:/app/faq_data:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: ./infra/Dockerfile.frontend
    container_name: nim-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

